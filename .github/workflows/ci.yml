name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mydb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정 (캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: MySQL 접속 확인
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SHOW DATABASES;"

      - name: 빌드 (컴파일 + 테스트)
        run: ./gradlew build
        env:
          DB_USERNAME: root
          DB_PASSWORD: root
          GOOGLE_CLIENT_ID: ci-dummy-client-id
          GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
          JWT_SECRET: ci-test-jwt-secret-key-must-be-at-least-32-bytes

  docker:
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'ci-pipeline')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 조건 값 확인 (디버깅용)
        run: echo "event=${{ github.event_name }} ref=${{ github.ref_name }}"

      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 + 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: | 
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max